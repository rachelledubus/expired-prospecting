name: Validate WoW Professions PR
on:
  push:
    branches:
      - feature/wow-professions-starter-20261111
  pull_request:
    paths:
      - 'app/(planner)/games/**'
      - 'lib/wow-forever-professions.ts'
      - 'lib/games-data.ts'
      - 'lib/wow-crafting-chain.ts'
      - 'lib/wow-material-farms.ts'
      - 'lib/wow-forever-source-expansion.ts'
      - 'lib/wowhead-forever-items.ts'
      - 'scripts/verify-wow-crafting-chain.cjs'
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit --pretty false
      - run: node scripts/verify-wow-crafting-chain.cjs
      - run: node scripts/verify-wow-forever-source-coverage.cjs
